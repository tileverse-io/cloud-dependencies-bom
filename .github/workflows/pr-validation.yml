name: Pull Request Validation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# cancel in-progress jobs or runs for this workflow for the same pr or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: POM Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip if this is a merged PR (tests already ran during PR validation)
    if: "github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'Merge pull request #')"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Check POM formatting
      run: make lint

    - name: Validate POM
      run: ./mvnw validate -ntp

  verify:
    name: Verify the SDKs against storage emulators
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip if this is a merged PR (tests already ran during PR validation)
    if: "github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'Merge pull request #')"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # the lowest Java version used by the projects importing this BOM
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Check convergence and run the verification tests
      run: ./mvnw -B -ntp verify

  # Summary job that depends on all others
  pr-validation-complete:
    name: PR Validation Complete
    runs-on: ubuntu-latest
    needs: [lint, verify]
    # Always run this job to ensure workflow concludes with success/failure
    if: always()

    steps:
    - name: Check all jobs status
      run: |
        echo "Lint: ${{ needs.lint.result }}"
        echo "Verify: ${{ needs.verify.result }}"

        # If jobs were skipped (merged PR), treat as success
        if [[ "${{ needs.lint.result }}" == "skipped" && "${{ needs.verify.result }}" == "skipped" ]]; then
          echo "Jobs skipped (merged PR) - treating as success"
          exit 0
        fi

        # Otherwise, all jobs must succeed
        if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.verify.result }}" != "success" ]]; then
          echo "PR validation failed"
          exit 1
        else
          echo "PR validation successful"
        fi
