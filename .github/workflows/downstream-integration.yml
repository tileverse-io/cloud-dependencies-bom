name: Downstream Integration

# Build downstream consumers of this BOM against the candidate version and run
# their cloud-storage integration tests, so a change to the exclusion policy that
# breaks a real consumer is caught before release. All jobs are secret-free:
# imageio-ext cog-azure/cog-gs read public COGs; geowebcache uses TestContainers.

on:
  workflow_dispatch:
    inputs:
      bom-version:
        description: "BOM version to test (blank = build and use this repo's ${revision})"
        required: false
        default: ""
      imageio-ext-ref:
        description: "imageio-ext git ref"
        required: false
        default: "master"
      geowebcache-ref:
        description: "geowebcache git ref"
        required: false
        default: "main"
  pull_request:
    paths:
      - "pom.xml"
      - ".github/workflows/downstream-integration.yml"
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  imageio-ext:
    name: imageio-ext COG (azure + gs, public)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cloud-dependencies-bom
        uses: actions/checkout@v4
        with:
          path: cloud-dependencies-bom
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Install candidate BOM
        working-directory: cloud-dependencies-bom
        run: ./mvnw -B -ntp -DskipTests install
      - name: Resolve BOM version
        id: bom
        working-directory: cloud-dependencies-bom
        run: |
          if [ -n "${{ inputs.bom-version }}" ]; then
            echo "version=${{ inputs.bom-version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(./mvnw -q -B -ntp help:evaluate -Dexpression=revision -DforceStdout)" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout imageio-ext
        uses: actions/checkout@v4
        with:
          repository: geosolutions-it/imageio-ext
          ref: ${{ inputs.imageio-ext-ref || 'master' }}
          path: imageio-ext
      - name: Build cog-reader
        working-directory: imageio-ext
        run: >
          mvn -B -ntp -U -DskipTests install
          -pl :imageio-ext-cog-reader -am
          -Dcloud-dependencies-bom.version=${{ steps.bom.outputs.version }}
      - name: Run cog-azure + cog-gs integration tests
        working-directory: imageio-ext
        run: >
          mvn -B -ntp -Pcog-azure,cog-gs verify -DskipTests -DskipITs=false
          -pl :imageio-ext-cog-reader
          -Dcloud-dependencies-bom.version=${{ steps.bom.outputs.version }}

  geowebcache:
    name: geowebcache ${{ matrix.store }} (TestContainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: azure
            module: ":gwc-azure-blob"
            profiles: "online,excludeAzureOnlineTests"
          - store: gcs
            module: ":gwc-gcs-blob"
            profiles: "online"
    steps:
      - name: Checkout cloud-dependencies-bom
        uses: actions/checkout@v4
        with:
          path: cloud-dependencies-bom
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Install candidate BOM
        working-directory: cloud-dependencies-bom
        run: ./mvnw -B -ntp -DskipTests install
      - name: Resolve BOM version
        id: bom
        working-directory: cloud-dependencies-bom
        run: |
          if [ -n "${{ inputs.bom-version }}" ]; then
            echo "version=${{ inputs.bom-version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(./mvnw -q -B -ntp help:evaluate -Dexpression=revision -DforceStdout)" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout geowebcache
        uses: actions/checkout@v4
        with:
          repository: GeoWebCache/geowebcache
          ref: ${{ inputs.geowebcache-ref || 'main' }}
          path: geowebcache
      - name: Run ${{ matrix.store }} blobstore integration tests
        working-directory: geowebcache
        run: >
          mvn verify -f geowebcache/pom.xml -pl ${{ matrix.module }} -am
          -P${{ matrix.profiles }}
          -DskipTests=true -DskipITs=false -B -ntp
          -Dcloud-dependencies-bom.version=${{ steps.bom.outputs.version }}
